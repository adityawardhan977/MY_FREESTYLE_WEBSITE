<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>

<body>

    <h1>My To-Do List</h1>

    <form method="POST">

        <input type="text" name="task" placeholder="Enter a task">

        <button type="submit">Add</button>

    </form>

    <ul>

        {% for task in tasks %}

        <li>
            {{ task }}

            <a href="/delete/{{ loop.index0 }}">
                Delete
            </a>
        </li>

        {% endfor %}

    </ul>

</body>
</html>
